# BHOOT Ephemeral Logging Configuration
# All system logs are strictly volatile in RAM and vanish on shutdown

[Journal]
Storage=volatile
Compress=yes
RuntimeMaxUse=64M
RuntimeKeepFree=128M
RuntimeMaxFileSize=8M
MaxRetentionSec=0
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no

