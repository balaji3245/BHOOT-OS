# BHOOT Power-Loss & Flash Memory Endurance Configuration
# Tuned for USB 3.0 flash drives to minimize dirty write queues and ensure atomic journal flushes
#
# HARDWARE LIMITATION DISCLOSURE — COMMODITY USB FLASH CONTROLLER WRITE CACHES:
# Commodity USB 3.0 flash drives (e.g. SanDisk Ultra, HP USB) employ consumer-grade
# Flash Translation Layer (FTL) microcontrollers with internal volatile SRAM/DRAM caches
# for write buffering, block allocation, and logical-to-physical address translation.
# Unlike enterprise NVMe/SATA SSDs, consumer USB thumb drives lack hardware Power Loss
# Protection (PLP) (i.e., tantalum capacitors to maintain internal rail voltage until FTL
# buffers flush to non-volatile NAND).
#
# Consequently, while OS-level dirty page reduction (below) and explicit userspace `sync` /
# `fsync` system calls flush dirty OS page tables across the USB transport layer, they
# CANNOT prevent FTL-level block corruption or mapping desynchronization if physical power
# is abruptly severed while the controller programs NAND cells or performs garbage collection.
#
# OPERATIONAL SAFETY REQUIREMENTS:
# 1. Operators must execute clean software shutdown (`systemctl poweroff` or power menu)
#    before physical USB drive disconnection.
# 2. Never unplug the USB drive while transactions or disk writes are active.
# 3. All disaster recovery procedures must rely on off-device encrypted backups.

# Reduce dirty writeback delay so data is committed promptly to flash
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_writeback_centisecs = 200
vm.dirty_expire_centisecs = 500

# Aggressive disk sync on sudden power off or emergency keybind
kernel.sysrq = 1

