# BHOOT Primary Bootloader Configuration (UEFI GRUB2)
# Private Financial Intelligence Operating System

set default="0"
set timeout=5

# Visual and terminal settings
insmod all_video
insmod font
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=1024x768,auto
    insmod gfxterm
    terminal_output gfxterm
else
    terminal_output console
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan

# Locate BHOOT storage volumes
search --no-floppy --set=bhoot_esp --label BHOOT_EFI

menuentry "BHOOT — Private Financial Intelligence OS (Secure Production)" --id bhoot-normal {
    echo "Loading BHOOT Linux Kernel..."
    linux /live/vmlinuz boot=live components quiet splash \
        net.ifnames=0 ipv6.disable=1 \
        slab_nomerge slub_debug=FZP mce=0 pti=on \
        init_on_alloc=1 init_on_free=1 \
        bhoot.offline=1 systemd.unified_cgroup_hierarchy=1 \
        persistence persistence-encryption=luks \
        systemd.mask=systemd-timesyncd.service \
        systemd.mask=NetworkManager.service \
        systemd.mask=wpa_supplicant.service \
        systemd.mask=bluetooth.service
    
    echo "Loading Cryptographic Initial Ramdisk..."
    initrd /live/initrd.img
}

menuentry "BHOOT — RAM-Only Diagnostic & Audit Mode (Non-Persistent)" --id bhoot-ram {
    echo "Loading BHOOT Kernel to RAM..."
    linux /live/vmlinuz boot=live components toram quiet splash \
        net.ifnames=0 ipv6.disable=1 \
        slab_nomerge slub_debug=FZP mce=0 pti=on \
        init_on_alloc=1 init_on_free=1 \
        bhoot.offline=1 bhoot.ram_only=1
    
    echo "Loading Initial Ramdisk..."
    initrd /live/initrd.img
}

menuentry "BHOOT — Offline Recovery Shell & Header Restore" --id bhoot-recovery {
    echo "Loading Recovery Kernel..."
    linux /live/vmlinuz boot=live components single \
        net.ifnames=0 ipv6.disable=1 \
        bhoot.offline=1 bhoot.recovery=1
    
    echo "Loading Recovery Ramdisk..."
    initrd /live/initrd.img
}

menuentry "Hardware Reboot" --id reboot {
    reboot
}

menuentry "System Poweroff" --id poweroff {
    halt
}

