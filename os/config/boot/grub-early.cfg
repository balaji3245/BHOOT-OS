# Early embedded GRUB configuration for BHOOT standalone EFI binary
# Locates the BHOOT_EFI volume by label regardless of BIOS disk assignment ($root)

serial --unit=0 --speed=115200
terminal_input --append serial console
terminal_output --append serial console

echo "=========================================================="
echo " [BHOOT GRUB Early Boot] Stage 1 EFI Initialized"
echo "=========================================================="
echo "Searching for BHOOT_EFI partition by label..."

search --no-floppy --set=root --label BHOOT_EFI
if [ -n "$root" ]; then
    echo "Found BHOOT_EFI on device: ($root)"
    if [ -f /EFI/BOOT/grub.cfg ]; then
        echo "Loading primary config: /EFI/BOOT/grub.cfg"
        configfile /EFI/BOOT/grub.cfg
    elif [ -f /boot/grub/grub.cfg ]; then
        echo "Loading fallback config: /boot/grub/grub.cfg"
        configfile /boot/grub/grub.cfg
    else
        echo "ERROR: grub.cfg not found on filesystem ($root)!"
    fi
else
    echo "Label search failed. Searching by UUID B800-0001..."
    search --no-floppy --set=root --fs-uuid B800-0001
    if [ -n "$root" ]; then
        echo "Found BHOOT_EFI by UUID: ($root)"
        configfile /EFI/BOOT/grub.cfg
    else
        echo "CRITICAL ERROR: Unable to locate BHOOT_EFI storage volume!"
    fi
fi
