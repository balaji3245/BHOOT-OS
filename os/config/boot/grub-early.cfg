# Early embedded GRUB configuration for BHOOT standalone EFI binary
# Locates the BHOOT_EFI volume by label regardless of BIOS disk assignment ($root)

set echo=0
search --no-floppy --set=bhoot_esp --label BHOOT_EFI
if [ -n "$bhoot_esp" ]; then
    set root=($bhoot_esp)
    if [ -f /EFI/BOOT/grub.cfg ]; then
        configfile /EFI/BOOT/grub.cfg
    elif [ -f /boot/grub/grub.cfg ]; then
        configfile /boot/grub/grub.cfg
    fi
else
    # Fallback to filesystem UUID search
    search --no-floppy --set=bhoot_esp --fs-uuid B800-0001
    if [ -n "$bhoot_esp" ]; then
        set root=($bhoot_esp)
        configfile /EFI/BOOT/grub.cfg
    fi
fi

